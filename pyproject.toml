[project]
name = "blazemap-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["mypy==1.20.2", "ruff==0.16.7"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "schemas.py"]
